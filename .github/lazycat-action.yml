version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/tailscale.lpk
  target_arch: amd64

update:
  strategy: publish
  version_source:
    type: image
    image: tailscale

build:
  run_buildscript: false

images:
  - id: tailscale
    target: service
    service: tailscale
    source: docker.io/tailscale/tailscale
    channel: stable
    tag_regex: '^v?\d+\.\d+\.\d+$'
    version_regex: '^v?(?P<version>\d+\.\d+\.\d+)$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Tailscale
    summary: Published from GitHub Actions
